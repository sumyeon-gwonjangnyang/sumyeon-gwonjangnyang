    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            getDoc, 
            setDoc, 
            deleteDoc, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVATnM_Zn1tWlDq-oKuaMOJ6o21_zVNeY",
            authDomain: "sumyeon-gwonjangnyang.firebaseapp.com",
            projectId: "sumyeon-gwonjangnyang",
            storageBucket: "sumyeon-gwonjangnyang.firebasestorage.app",
            messagingSenderId: "405140231078",
            appId: "1:405140231078:web:b8727f9e564518d9547567",
            measurementId: "G-FQM97QQB0P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const wikiCollection = collection(db, "wiki_pages");

        const USER_KEY = "namu_friend_user_v2";

        let wikiData = {};
        let currentPage = "수면 권장냥";
        let currentUser = { name: "친구", avatar: "😀" };

        function initFirebaseRealtime() {
            onSnapshot(wikiCollection, (snapshot) => {
                let fetchedData = {};
                snapshot.forEach((docSnapshot) => {
                    fetchedData[docSnapshot.id] = docSnapshot.data();
                });

                if (Object.keys(fetchedData).length > 0) {
                    wikiData = fetchedData;
                    renderRecentSidebar();
                    if (document.getElementById('view-section').classList.contains('hidden') === false) {
                        navigateTo(currentPage, false);
                    }
                }
            });
        }

        async function savePageToFirebase(pageTitle, pageObj) {
            try {
                await setDoc(doc(db, "wiki_pages", pageTitle), pageObj);
            } catch (e) {
                console.error("Firestore 저장 오류:", e);
                showToast("클라우드 저장에 실패했습니다.");
            }
        }

        async function deletePageFromFirebase(pageTitle) {
            try {
                await deleteDoc(doc(db, "wiki_pages", pageTitle));
            } catch (e) {
                console.error("Firestore 삭제 오류:", e);
            }
        }

        window.navigateTo = function(pageTitle, updateViews = true) {
            currentPage = pageTitle;
            hideAllSections();

            if (!wikiData[pageTitle]) {
                openEditorForNewPage(pageTitle);
                return;
            }

            const docObj = wikiData[pageTitle];
            if (updateViews) {
                docObj.views = (docObj.views || 0) + 1;
                savePageToFirebase(pageTitle, docObj);
            }

            document.getElementById('doc-title').textContent = docObj.title;
            document.getElementById('doc-category-badge').textContent = docObj.category || '일반';
            document.getElementById('doc-updated').textContent = docObj.updatedAt || '';
            document.getElementById('doc-author').textContent = docObj.author || '익명';
            document.getElementById('doc-views').textContent = docObj.views || 1;
            document.getElementById('doc-version-tag').textContent = `r${(docObj.history || []).length || 1}`;

            const parsed = parseWikiMarkup(docObj.content);
            document.getElementById('doc-body').innerHTML = parsed.renderedHtml;

            const tocContainer = document.getElementById('toc-container');
            const tocList = document.getElementById('toc-list');
            if (parsed.toc && parsed.toc.length > 0) {
                tocContainer.classList.remove('hidden');
                tocList.innerHTML = parsed.toc.map(item => {
                    let paddingClass = item.level === 2 ? 'pl-4' : (item.level === 3 ? 'pl-8' : '');
                    return `<li class="${paddingClass}"><a href="#toc-${item.id}" class="text-namu hover:underline"><span class="font-bold">${item.number}.</span> ${item.text}</a></li>`;
                }).join('');
            } else {
                tocContainer.classList.add('hidden');
            }

            document.getElementById('view-section').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderRecentSidebar();
            if (window.lucide) lucide.createIcons();
        };

        window.savePage = async function() {
            const content = document.getElementById('editor-content').value;
            const category = document.getElementById('editor-category').value;
            const summary = document.getElementById('editor-summary').value.trim() || '내용 수정';

            if (!content.trim()) {
                showToast("내용을 입력해주세요.");
                return;
            }

            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            if (!wikiData[currentPage]) {
                wikiData[currentPage] = { title: currentPage, category, author: currentUser.name, views: 0, history: [] };
            }

            const docObj = wikiData[currentPage];
            docObj.content = content;
            docObj.category = category;
            docObj.author = currentUser.name;
            docObj.updatedAt = dateStr;
            if (!docObj.history) docObj.history = [];
            docObj.history.unshift({ version: docObj.history.length + 1, author: currentUser.name, date: dateStr, summary });

            await savePageToFirebase(currentPage, docObj);
            showToast("클라우드에 안전하게 저장되었습니다!");
            window.navigateTo(currentPage, false);
        };

        // 비밀번호 검증 후 삭제 실행
        window.confirmDeleteCurrentPage = async function() {
            const passwordInput = document.getElementById('delete-password-input').value;
            if (passwordInput !== "180213") {
                showToast("비밀번호가 틀렸습니다!");
                return;
            }

            await deletePageFromFirebase(currentPage);
            delete wikiData[currentPage];
            closeDeleteModal();
            showToast(`'${currentPage}' 문서가 삭제되었습니다.`);
            window.navigateTo("수면 권장냥");
        };

        function parseWikiMarkup(text) {
            if (!text) return { renderedHtml: "", toc: [] };
            let toc = [];
            let headingCount = 0;
            let h2Count = 0;
            let h3Count = 0;
            let h4Count = 0;

            let lines = text.split('\n');
            let parsedLines = [];
            let inTable = false;
            let tableRows = [];

            for (let rawLine of lines) {
                let line = rawLine.trim();

                if (line === '----') {
                    if (inTable) { parsedLines.push(renderTable(tableRows)); inTable = false; tableRows = []; }
                    parsedLines.push('<hr class="my-4 border-t border-gray-300">');
                    continue;
                }

                if (line.startsWith('||') && line.endsWith('||')) {
                    inTable = true;
                    let cells = line.slice(2, -2).split('||').map(c => c.trim());
                    tableRows.push(cells);
                    continue;
                } else if (inTable) {
                    parsedLines.push(renderTable(tableRows));
                    inTable = false;
                    tableRows = [];
                }

                let h4Match = line.match(/^====\s*(.*?)\s*====$/);
                let h3Match = line.match(/^===\s*(.*?)\s*===$/);
                let h2Match = line.match(/^==\s*(.*?)\s*==$/);

                if (h4Match) {
                    headingCount++;
                    h4Count++;
                    let titleText = h4Match[1];
                    let id = `heading-${headingCount}`;
                    let numStr = `${h2Count || 1}.${h3Count || 1}.${h4Count}`;
                    toc.push({ id, level: 3, number: numStr, text: titleText });
                    parsedLines.push(`<h4 id="toc-${id}">${numStr}. ${titleText}</h4>`);
                    continue;
                } else if (h3Match) {
                    headingCount++;
                    h3Count++;
                    h4Count = 0;
                    let titleText = h3Match[1];
                    let id = `heading-${headingCount}`;
                    let numStr = h2Count > 0 ? `${h2Count}.${h3Count}` : `${h3Count}`;
                    toc.push({ id, level: 2, number: numStr, text: titleText });
                    parsedLines.push(`<h3 id="toc-${id}">${numStr}. ${titleText}</h3>`);
                    continue;
                } else if (h2Match) {
                    headingCount++;
                    h2Count++;
                    h3Count = 0;
                    h4Count = 0;
                    let titleText = h2Match[1];
                    let id = `heading-${headingCount}`;
                    let numStr = `${h2Count}`;
                    toc.push({ id, level: 1, number: numStr, text: titleText });
                    parsedLines.push(`<h2 id="toc-${id}">${numStr}. ${titleText}</h2>`);
                    continue;
                }

                if (line.startsWith('* ')) {
                    parsedLines.push(`<ul><li>${line.substring(2)}</li></ul>`);
                    continue;
                }

                parsedLines.push(rawLine ? `<p>${rawLine}</p>` : '<br>');
            }
            if (inTable) parsedLines.push(renderTable(tableRows));

            let html = parsedLines.join('');
            html = html.replace(/'''(.*?)'''/g, '<strong>$1</strong>');
            html = html.replace(/''(.*?)''/g, '<em>$1</em>');
            html = html.replace(/~~(.*?)~~/g, '<del class="text-gray-400">$1</del>');
            html = html.replace(/__(.*?)__/g, '<u class="underline decoration-namu decoration-2">$1</u>');

            html = html.replace(/\[\[파일:(.*?)(?:\|width=(\d+))?\]\]/g, (m, url, w) => {
                const style = w ? `style="width: ${w}px;"` : '';
                return `<img src="${url}" ${style} class="rounded shadow-sm my-2 max-w-full">`;
            });

            html = html.replace(/\[\[([^\]]+)\]\]/g, (match, p1) => {
                let target = p1, label = p1;
                if (p1.includes('|')) {
                    const parts = p1.split('|');
                    target = parts[0].trim();
                    label = parts.slice(1).join('|').trim();
                }
                let exists = !!wikiData[target];
                return exists ? `<span onclick="navigateTo('${target}')" class="wiki-link">${label}</span>` : `<span onclick="navigateTo('${target}')" class="wiki-link-new">${label}<sup>?</sup></span>`;
            });

            return { renderedHtml: html, toc };
        }

        function renderTable(rows) {
            if (!rows || rows.length === 0) return '';
            let html = '<div class="overflow-x-auto my-3"><table class="wiki-table"><tbody>';
            rows.forEach((row, rIdx) => {
                html += '<tr>';
                row.forEach((cell, cIdx) => {
                    let text = cell.replace(/'''/g, '');
                    if (rIdx === 0 || cIdx === 0) {
                        html += `<th>${text}</th>`;
                    } else {
                        html += `<td>${text}</td>`;
                    }
                });
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            return html;
        }

        function hideAllSections() {
            document.getElementById('view-section').classList.add('hidden');
            document.getElementById('editor-section').classList.add('hidden');
            document.getElementById('special-section').classList.add('hidden');
        }

        window.editCurrentPage = function() {
            hideAllSections();
            const docObj = wikiData[currentPage] || { title: currentPage, content: "", category: "일반" };
            document.getElementById('editor-page-title-display').textContent = currentPage;
            document.getElementById('editor-category').value = docObj.category || '일반';
            document.getElementById('editor-content').value = docObj.content || '';
            document.getElementById('editor-summary').value = '';
            document.getElementById('editor-section').classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        };

        function openEditorForNewPage(pageTitle) {
            currentPage = pageTitle;
            hideAllSections();
            document.getElementById('editor-page-title-display').textContent = pageTitle;
            document.getElementById('editor-category').value = '일반';
            document.getElementById('editor-content').value = `== 개요 ==\n${pageTitle} 문서입니다.`;
            document.getElementById('editor-summary').value = '문서 신규 생성';
            document.getElementById('editor-section').classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        window.insertSyntax = function(before, after) {
            const ta = document.getElementById('editor-content');
            const start = ta.selectionStart, end = ta.selectionEnd;
            ta.value = ta.value.substring(0, start) + before + ta.value.substring(start, end) + after + ta.value.substring(end);
            ta.focus();
        };

        window.cancelEdit = function() {
            window.navigateTo(wikiData[currentPage] ? currentPage : "수면 권장냥", false);
        };

        window.openUserModal = function() {
            document.getElementById('user-name-input').value = currentUser.name;
            document.getElementById('user-modal').classList.remove('hidden');
        };
        window.closeUserModal = function() { document.getElementById('user-modal').classList.add('hidden'); };
        window.saveUserProfile = function() {
            const name = document.getElementById('user-name-input').value.trim();
            if (name) {
                currentUser.name = name;
                localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
                updateUserUI();
            }
            closeUserModal();
        };
        function updateUserUI() {
            document.getElementById('current-user-name').textContent = currentUser.name;
        }

        window.openNewPageModal = function() {
            document.getElementById('new-page-title-input').value = '';
            document.getElementById('new-page-modal').classList.remove('hidden');
        };
        window.closeNewPageModal = function() { document.getElementById('new-page-modal').classList.add('hidden'); };
        window.createNewPageConfirm = function() {
            const title = document.getElementById('new-page-title-input').value.trim();
            if (title) {
                closeNewPageModal();
                window.navigateTo(title);
            }
        };

        window.openDeleteModal = function() {
            document.getElementById('delete-doc-title-display').textContent = currentPage;
            document.getElementById('delete-password-input').value = ''; // 창 열릴 때 입력란 초기화
            document.getElementById('delete-page-modal').classList.remove('hidden');
        };
        window.closeDeleteModal = function() { document.getElementById('delete-page-modal').classList.add('hidden'); };

        window.openImageModal = function() { document.getElementById('image-modal').classList.remove('hidden'); };
        window.closeImageModal = function() { document.getElementById('image-modal').classList.add('hidden'); };
        window.handleImageFileUpload = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                document.getElementById('image-url-input').value = evt.target.result;
            };
            reader.readAsDataURL(file);
        };
        window.insertImageFromModal = function() {
            const url = document.getElementById('image-url-input').value.trim();
            if (url) {
                insertSyntax(`[[파일:${url}|width=400]]`, '');
                closeImageModal();
            }
        };

        window.showHistory = function() {
            hideAllSections();
            const docObj = wikiData[currentPage];
            document.getElementById('special-title').textContent = `'${currentPage}' 역사`;
            let html = '<div class="space-y-2">';
            (docObj?.history || []).forEach(h => {
                html += `<div class="p-2 border-b text-xs flex justify-between"><span><b>r${h.version}</b> ${h.summary} (${h.author})</span><span>${h.date}</span></div>`;
            });
            html += '</div><button onclick="navigateTo(\''+currentPage+'\')" class="mt-4 px-3 py-1 bg-namu text-white text-xs rounded">돌아가기</button>';
            document.getElementById('special-content').innerHTML = html;
            document.getElementById('special-section').classList.remove('hidden');
        };

        window.showRecentChanges = function() {
            hideAllSections();
            document.getElementById('special-title').textContent = '최근 변경 내역';
            let pages = Object.values(wikiData).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
            let html = '<div class="divide-y">';
            pages.forEach(p => {
                html += `<div class="py-2 flex justify-between text-xs cursor-pointer" onclick="navigateTo('${p.title}')"><span class="font-bold text-namu">${p.title}</span><span class="text-gray-400">${p.updatedAt}</span></div>`;
            });
            html += '</div>';
            document.getElementById('special-content').innerHTML = html;
            document.getElementById('special-section').classList.remove('hidden');
        };

        function renderRecentSidebar() {
            const list = document.getElementById('sidebar-recent-list');
            let pages = Object.values(wikiData).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)).slice(0, 5);
            list.innerHTML = pages.map(p => `<div class="p-2 hover:bg-gray-50 cursor-pointer truncate" onclick="navigateTo('${p.title}')">${p.title}</div>`).join('');
        }
        window.renderRecentSidebar = renderRecentSidebar;

        window.goToRandomPage = function() {
            const keys = Object.keys(wikiData);
            if (keys.length > 0) window.navigateTo(keys[Math.floor(Math.random() * keys.length)]);
        };

        window.handleSearchInput = function(val) {
            const res = document.getElementById('search-results');
            const q = val.trim().toLowerCase();
            if (!q) { res.classList.add('hidden'); return; }
            let matches = Object.keys(wikiData).filter(k => k.toLowerCase().includes(q));
            if (matches.length > 0) {
                res.innerHTML = matches.map(m => `<div class="p-2 hover:bg-namu-light text-xs cursor-pointer" onclick="navigateTo('${m}'); document.getElementById('search-results').classList.add('hidden');">${m}</div>`).join('');
                res.classList.remove('hidden');
            } else {
                res.classList.add('hidden');
            }
        };
        window.executeSearch = function() {
            const val = document.getElementById('search-input').value.trim();
            if (val) window.navigateTo(val);
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }
        document.getElementById('toggle-sidebar-btn').addEventListener('click', toggleSidebar);

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2000);
        }

        const savedUser = localStorage.getItem(USER_KEY);
        if (savedUser) {
            try { currentUser = JSON.parse(savedUser); } catch(e) {}
        }
        updateUserUI();
        initFirebaseRealtime();
    </script>
</body>
</html>
